# API CONNECTOR CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

api_connectors:
  finance:
    base_url: "https://api.finra.org"
    endpoints:
      brokercheck: "/brokercheck/v1/firm/{crd}"
      disciplinary_actions: "/disciplinary/actions/{awc_number}"
      dtc_participant_directory: "/dtc/participants"
    auth:
      type: "OAUTH2_CLIENT_CREDENTIALS"
      token_url: "https://api.finra.org/oauth2/token"
      scopes: ["brokercheck:read", "disciplinary:read", "dtc:read"]

  github_mcp_direct:
    base_url: "https://api.github.com"
    endpoints:
      schema_registry: "/repos/{owner}/{repo}/contents/schemas/filing-packet"
      workflow_runs: "/repos/{owner}/{repo}/actions/workflows/filing-engine.yml/runs"
    auth:
      type: "BEARER_TOKEN"
      token_env: "GITHUB_MCP_TOKEN"

  broadridge_proxypulse:
    base_url: "https://api.broadridge.com/proxypulse/v1"
    auth:
      type: "MUTUAL_TLS"
      cert_env: "BROADRIDGE_CLIENT_CERT"
      key_env: "BROADRIDGE_CLIENT_KEY"
    endpoints:
      proxy_statements: "/statements/{control_number}"
      position_reports: "/positions/{cusip}/{participant_id}"

  dtc_participant_portal:
    base_url: "https://dtcc-api.broadridge.com/participant/v1"
    auth:
      type: "CERT_BASED"
      cert_env: "DTC_CLIENT_CERT"
    endpoints:
      position_query: "/positions/query"
      participant_directory: "/directory"

# ─────────────────────────────────────────────────────────────────────────────
# AUDIT & COMPLIANCE LOGGING
# ─────────────────────────────────────────────────────────────────────────────

audit_log:
  events:
    - PACKET_CREATED
    - EVIDENCE_COLLECTED
    - SCHEMA_VALIDATED
    - Z3_CHECK_PASSED
    - Z3_CHECK_FAILED
    - COMPLIANCE_REVIEWED
    - SUBMITTED_TO_PORTAL
    - PORTAL_ACKNOWLEDGED
    - RESPONSE_RECEIVED
    - ESCALATION_FILED
    - DEADLINE_BREACHED
    - PACKET_CLOSED
  retention: "7_years"
  storage:
    - type: "kafka"
      topic: "sovereign.filing.audit"
      partitions: 32
    - type: "postgresql"
      table: "filing_audit_log"
      partition_by: "packet_id"
  immutable: true
  tamper_evident: true
  merkle_tree: true

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

deployment:
  engine:
    runtime: "python:3.12-slim"
    framework: "fastapi"
    validation: "pydantic_v2"
    solver: "z3-solver>=4.12"
    event_bus: "kafka"
    schema_registry: "confluent-schema-registry"

  scaling:
    min_replicas: 2
    max_replicas: 10
    target_cpu: 70

  monitoring:
    metrics:
      - filing_packet_throughput
      - z3_solve_latency_p99
      - api_submission_success_rate
      - deadline_compliance_rate
    alerts:
      - name: "deadline_breach_imminent"
        condition: "response_due < now() + 2_business_days && status == ACKNOWLEDGED"
      - name: "z3_unsat"
        condition: "z3_check_result == UNSAT"
      - name: "submission_failure"
        condition: "submission_success_rate < 0.95"

