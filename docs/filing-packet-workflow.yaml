# filing-packet-workflow.yaml
# Schema-first deterministic workflow engine for regulatory filing packets
# Compatible with Z3 solver validation, FastAPI/Pydantic, Kafka event sourcing

version: "1.0.0"
namespace: "sovereign.financial.infrastructure.filing"

# ─────────────────────────────────────────────────────────────────────────────
# CORE TYPE DEFINITIONS
# ─────────────────────────────────────────────────────────────────────────────

types:
  FilingPacketID:
    type: string
    pattern: "^H8RMMF-[1-3]$|^TCR-\\d{8}-\\d{4}$|^FINRA-COMP-\\d{8}-\\d{4}$|^DTC-ESC-\\d{8}-\\d{4}$"
    description: "Immutable filing packet identifier with embedded taxonomy"

  CustodianID:
    type: string
    enum: ["APEX_CLEARING", "NFS_FIDELITY", "TRADEUP_PLYNK", "DTC_PARTICIPANT"]
    description: "Canonical custodian/participant identifiers"

  FilingType:
    type: string
    enum:
      - "H8RMMF_1_APEX_STATEMENT_FAILURE"      # FINRA 2231/4311(c)(2) → Apex CCO
      - "H8RMMF_2_NFS_POSITION_GAP"            # FINRA 2231/4311(c)(2) → NFS via Plynk
      - "H8RMMF_3_NFS_POSITION_GAP"            # Conditional on verification
      - "TCR_SEA_17A3_17A4_BOOKS_RECORDS"      # SEC TCR portal, single narrative
      - "FINRA_INVESTOR_COMPLAINT_2231_4311"   # FINRA Investor Complaint portal
      - "DTC_PARTICIPANT_DISCREPANCY_4311"     # DTC participant position discrepancy
      - "DTC_ESCALATION_COMPLIANCE"            # 10-business-day written response demand
    description: "Exhaustive filing type taxonomy — one violation, one filing"

  RegulatoryCitation:
    type: object
    required: [rule, description, enforcement_action]
    properties:
      rule: { type: string, pattern: "^(SEC|FINRA|DTC|SEA)\\s+\\d+[A-Z]?\\-\\d+[A-Z]?(\\\(\\\\w+\\\\))?$" }
      description: { type: string }
      enforcement_action: { type: string, enum: ["no_action", "wells_notice", "awc", "complaint", "bar"] }

  EvidenceArtifact:
    type: object
    required: [artifact_id, type, hash_sha256, source_uri, retrieved_at, chain_of_custody]
    properties:
      artifact_id: { type: string, pattern: "^EV-\\d{8}-\\d{6}-[A-F0-9]{8}$" }
      type: { type: string, enum: ["BROKERCHECK_SNAPSHOT", "AWC_TEXT", "DTC_POSITION_REPORT", "PROXY_STATEMENT", "DTC_PARTICIPANT_DIR", "ACCOUNT_STATEMENT", "TRANSACTION_HISTORY", "CORPORATE_ACTION_NOTICE", "CALL_LOG", "EMAIL_CORRESPONDENCE", "COMPLIANCE_ESCALATION_EMAIL"] }
      hash_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      source_uri: { type: string, format: "uri" }
      retrieved_at: { type: string, format: "date-time" }
      chain_of_custody: { type: array, items: { type: string } }

  FilingPacket:
    type: object
    required: [packet_id, filing_type, custodian, regulatory_citations, evidence_artifacts, narrative, deadlines, submission_target]
    properties:
      packet_id: { $ref: "#/types/FilingPacketID" }
      filing_type: { $ref: "#/types/FilingType" }
      custodian: { $ref: "#/types/CustodianID" }
      regulatory_citations: { type: array, items: { $ref: "#/types/RegulatoryCitation" }, minItems: 1 }
      evidence_artifacts: { type: array, items: { $ref: "#/types/EvidenceArtifact" }, minItems: 1 }
      narrative: { type: string, minLength: 500, maxLength: 10000 }
      deadlines:
        type: object
        required: [response_due, escalation_trigger, statute_of_limitations]
        properties:
          response_due: { type: string, format: "date-time" }
          escalation_trigger: { type: string, format: "date-time" }
          statute_of_limitations: { type: string, format: "date-time" }
      submission_target:
        type: object
        required: [portal, api_endpoint, authentication_method]
        properties:
          portal: { type: string, enum: ["FINRA_INVESTOR_COMPLAINT", "SEC_TCR", "FINRA_BROKERCHECK", "DTC_PARTICIPANT_PORTAL", "BROADRIDGE_PROXYPULSE", "CCO_EMAIL", "COMPLIANCE_PORTAL"] }
          api_endpoint: { type: string, format: "uri" }
          authentication_method: { type: string, enum: ["OAUTH2_CLIENT_CREDENTIALS", "API_KEY", "MUTUAL_TLS", "CERT_BASED"] }
      status: { type: string, enum: ["DRAFT", "VALIDATED", "SUBMITTED", "ACKNOWLEDGED", "ESCALATED", "CLOSED", "NO_ACTION"] }
      created_at: { type: string, format: "date-time" }
      updated_at: { type: string, format: "date-time" }
      submitted_at: { type: string, format: "date-time", nullable: true }
      reference_numbers: { type: array, items: { type: string } }

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW STATE MACHINE
# ─────────────────────────────────────────────────────────────────────────────

workflow:
  states:
    - DRAFT
    - EVIDENCE_COLLECTION
    - SCHEMA_VALIDATION
    - Z3_CONSTRAINT_CHECK
    - COMPLIANCE_REVIEW
    - SUBMISSION_QUEUE
    - SUBMITTED
    - ACKNOWLEDGED
    - RESPONSE_RECEIVED
    - ESCALATION_PENDING
    - ESCALATED
    - CLOSED
    - NO_ACTION_LETTER

  transitions:
    - from: DRAFT
      to: EVIDENCE_COLLECTION
      trigger: initiate_evidence_gathering
      conditions: ["has_filing_type", "has_custodian"]
    - from: EVIDENCE_COLLECTION
      to: SCHEMA_VALIDATION
      trigger: evidence_complete
      conditions: ["all_artifacts_collected", "hashes_verified"]
    - from: SCHEMA_VALIDATION
      to: Z3_CONSTRAINT_CHECK
      trigger: schema_valid
      conditions: ["pydantic_valid", "required_fields_present"]
    - from: Z3_CONSTRAINT_CHECK
      to: COMPLIANCE_REVIEW
      trigger: constraints_satisfied
      conditions: ["z3_sat", "regulatory_citations_valid", "deadlines_feasible"]
    - from: COMPLIANCE_REVIEW
      to: SUBMISSION_QUEUE
      trigger: compliance_approved
      conditions: ["narrative_reviewed", "exhibits_labeled", "escalation_path_defined"]
    - from: SUBMISSION_QUEUE
      to: SUBMITTED
      trigger: submit_to_portal
      conditions: ["api_available", "auth_valid"]
    - from: SUBMITTED
      to: ACKNOWLEDGED
      trigger: portal_acknowledgment
      conditions: ["reference_number_received"]
    - from: ACKNOWLEDGED
      to: RESPONSE_RECEIVED
      trigger: response_received
      conditions: ["within_response_deadline"]
    - from: ACKNOWLEDGED
      to: ESCALATION_PENDING
      trigger: deadline_breached
      conditions: ["past_response_due", "no_response"]
    - from: ESCALATION_PENDING
      to: ESCALATED
      trigger: file_escalation
      conditions: ["escalation_packet_ready"]
    - from: RESPONSE_RECEIVED
      to: CLOSED
      trigger: resolution_accepted
      conditions: ["documents_received", "positions_verified"]
    - from: ESCALATED
      to: CLOSED
      trigger: regulatory_action
      conditions: ["awc_issued", "fine_levied", "bar_ordered"]
    - from: "*"
      to: NO_ACTION_LETTER
      trigger: no_action_received
      conditions: ["finra_no_action_letter_received"]

# ─────────────────────────────────────────────────────────────────────────────
# AUTOMATED EVIDENCE COLLECTION PIPELINES
# ─────────────────────────────────────────────────────────────────────────────

evidence_pipelines:
  BROKERCHECK_SNAPSHOT:
    source: "finance_connector.finra.brokercheck"
    method: "GET /brokercheck/v1/firm/{crd_number}"
    params:
      crd_number: { type: string, pattern: "^\\d{1,6}$" }
    output: EvidenceArtifact
    transformation: |
      artifact_id = f"EV-{datetime.now():%Y%m%d-%H%M%S}-{sha256(response.content)[:8].upper()}"
      return EvidenceArtifact(
        artifact_id=artifact_id,
        type="BROKERCHECK_SNAPSHOT",
        hash_sha256=sha256(response.content).hexdigest(),
        source_uri=f"https://api.finra.org/brokercheck/v1/firm/{crd_number}",
        retrieved_at=datetime.utcnow().isoformat(),
        chain_of_custody=[f"finance_connector@{socket.gethostname()}"]
      )

  AWC_TEXT:
    source: "finance_connector.finra.disciplinary_actions"
    method: "GET /disciplinary/actions/{awc_number}"
    params:
      awc_number: { type: string, pattern: "^\\d{8}$" }
    output: EvidenceArtifact
    transformation: similar_to_above

  DTC_POSITION_REPORT:
    source: "custodian_dtc_portal"  # Requires prime broker DTC access
    method: "POST /participant/position/query"
    params:
      cusip: { type: string, pattern: "^\\d{9}$" }
      participant_ids: { type: array, items: { type: string, pattern: "^\\d{4}$" } }
      as_of_date: { type: string, format: "date" }
    output: EvidenceArtifact
    notes: "Requires Broadridge/ProxyPulse API or custodian DTC participant portal credentials"

  DTC_PARTICIPANT_DIR:
    source: "finance_connector.dtc.participant_directory"
    method: "GET /participants"
    output: EvidenceArtifact

  PROXY_STATEMENT:
    source: "broadridge_proxypulse"
    method: "GET /proxy/v1/statements/{control_number}"
    params:
      control_number: { type: string }
    output: EvidenceArtifact

# ─────────────────────────────────────────────────────────────────────────────
# SUBMISSION ADAPTERS (FINRA/SEC/DTC APIs)
# ─────────────────────────────────────────────────────────────────────────────

submission_adapters:
  FINRA_INVESTOR_COMPLAINT:
    api_base: "https://api.finra.org/investor-complaint/v1"
    auth: "OAUTH2_CLIENT_CREDENTIALS"
    endpoint: "/complaints"
    payload_mapping: |
      {
        "complaintType": "INVESTOR_COMPLAINT",
        "firmCRDNumber": packet.custodian.crd_number,
        "complaintText": packet.narrative,
        "attachments": [
          {"artifactId": a.artifact_id, "content": base64(a.content), "hash": a.hash_sha256}
          for a in packet.evidence_artifacts
        ],
        "regulatoryCitations": [c.rule for c in packet.regulatory_citations],
        "requestedRelief": "WRITTEN_RESPONSE_10_BUSINESS_DAYS"
      }
    response_schema:
      complaintId: string
      status: string
      submittedAt: datetime

  SEC_TCR:
    api_base: "https://api.sec.gov/tcr/v1"
    auth: "CERT_BASED"
    endpoint: "/tips-complaints-referrals"
    payload_mapping: |
      {
        "submissionType": "TCR",
        "narrative": packet.narrative,
        "entities": [{"name": packet.custodian.name, "crdNumber": packet.custodian.crd_number}],
        "violations": [{"rule": c.rule, "description": c.description} for c in packet.regulatory_citations],
        "exhibits": [{"id": a.artifact_id, "description": a.type, "hash": a.hash_sha256} for a in packet.evidence_artifacts]
      }

  DTC_ESCALATION:
    api_base: "https://dtcc-api.broadridge.com/participant/v1"
    auth: "MUTUAL_TLS"
    endpoint: "/escalations"
    payload_mapping: |
      {
        "cusip": packet.evidence_artifacts[0].metadata.cusip,
        "participantIds": packet.evidence_artifacts[0].metadata.participant_ids,
        "discrepancyType": "POSITION_MISMATCH",
        "proxyEvidence": packet.evidence_artifacts.filter(a => a.type == "PROXY_STATEMENT"),
        "demandWrittenResponseDays": 10,
        "regulatoryCitations": [c.rule for c in packet.regulatory_citations]
      }

